name: Build APK (Arabic edition)

on:
  workflow_dispatch:
  push:
    branches: [devel]
    paths:
      - "app/src/main/**"
      - ".github/workflows/build-apk.yml"
      - "tools/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-37" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Generate custom launcher icons
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/generate_icons.py

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK
        run: |
          UNSIGNED=$(ls app/build/outputs/apk/release/*-unsigned.apk | head -n 1)
          echo "Unsigned APK: $UNSIGNED"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -alias kotatsu-arabic -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass android -keypass android \
            -dname "CN=Kotatsu Arabic, O=Personal, C=EG"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/35.0.0)
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass pass:android --key-pass pass:android \
            --out "$RUNNER_TEMP/Kotatsu-Arabic.apk" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/Kotatsu-Arabic.apk"
          cp "$RUNNER_TEMP/Kotatsu-Arabic.apk" ./Kotatsu-Arabic.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kotatsu-Arabic-apk
          path: Kotatsu-Arabic.apk

      - name: Publish APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kotatsu Arabic — build ${{ github.run_number }}
          body: |
            نسخة كوتاتسو بالمصادر العربية فقط (49 مصدرًا) والأيقونة الجديدة.
            ثبّت ملف Kotatsu-Arabic.apk مباشرة على الهاتف.
          files: Kotatsu-Arabic.apk
