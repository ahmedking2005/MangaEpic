name: Build APK (Manga Epic)

on:
  workflow_dispatch:
  push:
    branches: [devel]
    paths:
      - "app/src/main/**"
      - ".github/workflows/build-apk.yml"
      - "tools/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        run: echo "Using preinstalled Android SDK at $ANDROID_HOME"

      - name: Install SDK components
        run: |
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin" && sdkmanager "platforms;android-37.0" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Generate custom launcher icons
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/generate_icons.py

      - name: Set app version
        run: |
          sed -i "s/versionName = '.*'/versionName = '9.9.${{ github.run_number }}'/" app/build.gradle
          sed -i "s/versionCode = 2049/versionCode = $((2049 + ${{ github.run_number }}))/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK
        run: |
          UNSIGNED=$(ls app/build/outputs/apk/release/*-unsigned.apk | head -n 1)
          echo "Unsigned APK: $UNSIGNED"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/35.0.0)
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass pass:android --key-pass pass:android \
            --out "$RUNNER_TEMP/Manga-Epic.apk" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/Manga-Epic.apk"
          cp "$RUNNER_TEMP/Manga-Epic.apk" ./Manga-Epic.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manga-Epic-apk
          path: Manga-Epic.apk

      - name: Publish APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v9.9.${{ github.run_number }}
          name: Manga Epic — build ${{ github.run_number }}
          body: |
            نسخة Manga Epic بالمصادر العربية فقط (49 مصدرًا) وبهوية مستقلة جديدة.
            ثبّت ملف Manga-Epic.apk مباشرة على الهاتف.
          files: Manga-Epic.apk
