pluginManagement {
	repositories {
		google {
			content {
				includeGroupByRegex("com\\.android.*")
				includeGroupByRegex("com\\.google.*")
				includeGroupByRegex("androidx.*")
			}
		}
		mavenCentral()
		gradlePluginPortal()
		maven {
			url 'https://jitpack.io'
			content {
				includeGroupByRegex("com\\.github.*")
			}
		}
	}
}
dependencyResolutionManagement {
	repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
	repositories {
		google()
		mavenCentral()
		maven {
			url 'https://jitpack.io'
		}
		// Manga Epic mediation: Mintegral SDK artifacts are hosted on Mintegral's own
		// Maven repo (required by the AdMob Mintegral adapter; see stage-mediation notes).
		maven {
			url 'https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea'
		}
	}
}

include ':app'
rootProject.name = "MangaEpic"

// Manga Epic: the maintained parsers fork is bundled with this repository
// (kotatsu-parsers/) so a checkout contains the complete source used by the
// application, including the Manga Epic contract extensions (anime/novels)
// and the Arabic sources that only exist in our fork.
def localParsers = file('kotatsu-parsers')
if (localParsers.isDirectory()) {
	includeBuild(localParsers) {
		dependencySubstitution {
			substitute module('com.github.clquwu:kotatsu-parsers-redo') using project(':')
		}
	}
}
